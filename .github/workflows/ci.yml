name: Flutter CI & Build Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  analyze_and_test:
    name: Run Analysis & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build_android:
    name: Build Android APK
    needs: analyze_and_test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter pub get
      - run: flutter build apk --release --no-tree-shake-icons
      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HiveMuse-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  build_ios:
    name: Build iOS (Apple) App
    needs: analyze_and_test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign --no-tree-shake-icons
      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HiveMuse-iOS-App
          path: build/ios/iphoneos/

  create_release:
    name: Publish GitHub Release
    needs: [build_android, build_ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: HiveMuse-Android-APK
          path: release-artifacts/android
      - name: Download iOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: HiveMuse-iOS-App
          path: release-artifacts/ios
      - name: Package Release Files
        run: |
          cd release-artifacts/ios && zip -r ../HiveMuse-iOS-RunnerApp.zip . && cd ../..
          cp release-artifacts/android/app-release.apk release-artifacts/HiveMuse-Android-v1.0.0.apk
      - name: Create or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0.0 release-artifacts/HiveMuse-Android-v1.0.0.apk release-artifacts/HiveMuse-iOS-RunnerApp.zip --title "HiveMuse Release v1.0.0" --notes "Release build featuring HiveMuse Android APK (HiveMuse-Android-v1.0.0.apk) and Apple iOS App payload (HiveMuse-iOS-RunnerApp.zip)." --clobber

